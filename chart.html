<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>종목 차트 진단</title>
<style>
  :root{
    color-scheme: light;
    --surface-1:#fcfcfb; --page:#f9f9f7;
    --ink-1:#0b0b0b; --ink-2:#52514e; --ink-3:#898781;
    --grid:#e1e0d9; --axis:#c3c2b7; --ring:rgba(11,11,11,.10);
    --up:#d03b3b; --down:#2a78d6;         /* 한국식: 빨강=상승, 파랑=하락 */
    --ma20:#c8801a; --ma60:#1baf7a; --ma200:#8459c8;
    --rsi:#3d7a47; --bandfill:rgba(42,120,214,.08);
  }
  @media (prefers-color-scheme: dark){
    :root:where(:not([data-theme="light"])){
      color-scheme: dark;
      --surface-1:#1a1a19; --page:#0d0d0d;
      --ink-1:#ffffff; --ink-2:#c3c2b7; --ink-3:#898781;
      --grid:#2c2c2a; --axis:#383835; --ring:rgba(255,255,255,.10);
      --up:#e66767; --down:#3987e5;
      --ma20:#e2a24a; --ma60:#199e70; --ma200:#a583e0;
      --rsi:#5aa967; --bandfill:rgba(57,135,229,.12);
    }
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --surface-1:#1a1a19; --page:#0d0d0d;
    --ink-1:#ffffff; --ink-2:#c3c2b7; --ink-3:#898781;
    --grid:#2c2c2a; --axis:#383835; --ring:rgba(255,255,255,.10);
    --up:#e66767; --down:#3987e5;
    --ma20:#e2a24a; --ma60:#199e70; --ma200:#a583e0;
    --rsi:#5aa967; --bandfill:rgba(57,135,229,.12);
  }
  *{box-sizing:border-box}
  body{ margin:0; background:var(--page); color:var(--ink-1);
    font-family: system-ui,-apple-system,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
    font-size:15px; line-height:1.6; -webkit-font-smoothing:antialiased; }
  .wrap{max-width:980px; margin:0 auto; padding:26px 18px 70px}
  header{display:flex; align-items:flex-end; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:4px}
  h1{font-size:21px; margin:0 0 3px; letter-spacing:-.01em}
  .sub{color:var(--ink-2); font-size:13px; margin:0}
  a.back{color:var(--ink-3); font-size:13px; text-decoration:none}
  a.back:hover{color:var(--ink-1)}
  .card{ background:var(--surface-1); border:1px solid var(--ring); border-radius:14px; padding:18px 20px; margin-top:16px; }
  .controls{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
  .searchbox{position:relative; flex:1 1 260px; max-width:340px}
  .searchbox input{ width:100%; font:inherit; font-size:14px; padding:9px 12px; border-radius:9px;
    border:1px solid var(--axis); background:var(--surface-1); color:var(--ink-1); }
  .searchbox input::placeholder{color:var(--ink-3)}
  .sresults{ position:absolute; top:calc(100% + 4px); left:0; right:0; z-index:9;
    background:var(--surface-1); border:1px solid var(--axis); border-radius:10px;
    box-shadow:0 6px 18px rgba(0,0,0,.14); overflow:hidden; display:none; }
  .sresults button{ display:block; width:100%; text-align:left; font:inherit; font-size:13.5px;
    padding:9px 12px; border:0; background:transparent; color:var(--ink-1); cursor:pointer; }
  .sresults button:hover{background:var(--bandfill)}
  .sresults .meta{color:var(--ink-3); font-size:12px}
  .sresults .empty{padding:10px 12px; font-size:13px; color:var(--ink-3)}
  select{ font:inherit; font-size:14px; padding:9px 12px; border-radius:9px;
    border:1px solid var(--axis); background:var(--surface-1); color:var(--ink-1); min-width:240px; }
  .seg{display:flex; border:1px solid var(--axis); border-radius:9px; overflow:hidden}
  .seg button{ font:inherit; font-size:13px; padding:8px 14px; border:0; background:transparent; color:var(--ink-2); cursor:pointer; }
  .seg button.on{background:var(--ink-1); color:var(--page)}
  .statrow{display:flex; gap:8px; flex-wrap:wrap; margin-top:14px}
  .stat{ flex:1 1 130px; border:1px solid var(--ring); border-radius:10px; padding:9px 12px; }
  .stat .k{font-size:11.5px; color:var(--ink-3)}
  .stat .v{font-size:16px; font-weight:700; letter-spacing:-.01em}
  .stat .v small{font-size:12px; font-weight:400; color:var(--ink-3)}
  .pos{color:var(--up)} .neg{color:var(--down)}
  figure{margin:14px 0 0; position:relative}
  figure svg{width:100%; height:auto; display:block}
  #tip{ position:absolute; display:none; pointer-events:none; z-index:5;
    background:var(--surface-1); border:1px solid var(--axis); border-radius:9px;
    padding:8px 11px; font-size:12px; line-height:1.5; box-shadow:0 4px 14px rgba(0,0,0,.12); white-space:nowrap; }
  #tip b{font-size:12.5px}
  .read{list-style:none; margin:0; padding:0}
  .read li{ display:flex; gap:10px; align-items:flex-start; font-size:14px; margin-bottom:10px; }
  .read .chip{ flex:0 0 auto; width:13px; height:13px; border-radius:4px; margin-top:5px; }
  #diag h2{font-size:15px; margin:0 0 10px}
  .dg{ border-left:3px solid var(--axis); padding:2px 0 2px 12px; margin:0 0 12px; font-size:14px; }
  .dg b.t{display:block; font-size:12.5px; color:var(--ink-3); font-weight:700; margin-bottom:1px}
  .verdict{ background:var(--bandfill); border-radius:10px; padding:12px 14px; font-size:14px; margin-top:4px; }
  .disc{font-size:12px; color:var(--ink-3); margin-top:14px}
  .loading{color:var(--ink-3); font-size:14px; padding:30px 0; text-align:center}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div>
    <h1>📊 종목 차트 진단</h1>
    <p class="sub" id="asof">데이터 불러오는 중…</p>
  </div>
  <a class="back" href="index.html">← 투자계절 대시보드</a>
</header>

<div class="card">
  <div class="controls">
    <div class="searchbox">
      <input id="q" placeholder="🔍 아무 종목이나 검색 (예: 삼성전자, TIGER 미국S&P500, AAPL)" autocomplete="off">
      <div class="sresults" id="sres"></div>
    </div>
    <div class="seg" id="rangeSeg">
      <button data-m="3">3개월</button>
      <button data-m="6" class="on">6개월</button>
      <button data-m="12">1년</button>
    </div>
  </div>
  <div class="statrow" id="stats"></div>
  <figure id="fig"><div class="loading">차트 준비 중…</div><div id="tip"></div></figure>
  <p class="disc" style="margin-top:8px">💡 차트 위에 마우스를 올리면(모바일은 터치) 그날의 가격을 볼 수 있어요.</p>
</div>

<div class="card" id="diag" style="display:none">
  <h2>📋 자동 진단 <span style="font-weight:400;color:var(--ink-3);font-size:12px">— 차트 기초 가이드의 기준을 그대로 적용한 규칙 기반 해석</span></h2>
  <div class="verdict" id="verdict" style="margin:0 0 14px"></div>
  <div id="diagBody"></div>
  <p class="disc">※ 전일 종가 기준, 매 영업일 아침 06:30경 자동 갱신. 이 진단은 가격 데이터만으로 만든 참고 정보이며 투자 판단·권유가 아닙니다. 급등락에는 뉴스·실적 등 차트 밖 이유가 있는지 꼭 함께 확인하세요.</p>
</div>

<div class="card" id="readCard" style="display:none">
  <h2 style="font-size:15px;margin:0 0 12px">👀 이 차트에서 눈에 보이는 것 <span style="font-weight:400;color:var(--ink-3);font-size:12px">— 색깔별로 따라 읽기</span></h2>
  <ul class="read" id="readBody"></ul>
</div>
</div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const fmt = (v, d=0) => v==null ? '–' : v.toLocaleString('ko-KR', {maximumFractionDigits:d, minimumFractionDigits:0});
const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

let DATA = null, CUR = null, MONTHS = 6;

/* ---------- 지표 계산 ---------- */
function smaSeries(c, k){ const o=[]; for(let i=0;i<c.length;i++){const w=c.slice(Math.max(0,i-k+1),i+1); o.push(w.reduce((a,b)=>a+b,0)/w.length);} return o; }
function bbSeries(c, k=20, m=2){
  const u=[], l=[];
  for(let i=0;i<c.length;i++){
    const w=c.slice(Math.max(0,i-k+1),i+1);
    const mid=w.reduce((a,b)=>a+b,0)/w.length;
    const sd=Math.sqrt(w.reduce((a,b)=>a+(b-mid)**2,0)/w.length);
    u.push(mid+m*sd); l.push(mid-m*sd);
  }
  return {u,l};
}
function rsiSeries(c, p=14){
  const n=c.length, out=new Array(n).fill(null);
  if(n<p+1) return out;
  let g=0,l=0;
  for(let i=1;i<=p;i++){const d=c[i]-c[i-1]; g+=Math.max(d,0); l+=Math.max(-d,0);}
  let ag=g/p, al=l/p;
  out[p]=100-100/(1+(al?ag/al:99));
  for(let i=p+1;i<n;i++){
    const d=c[i]-c[i-1];
    ag=(ag*(p-1)+Math.max(d,0))/p; al=(al*(p-1)+Math.max(-d,0))/p;
    out[i]=100-100/(1+(al?ag/al:99));
  }
  return out;
}
/* 원시 시계열 → 진단용 종목 객체 (검색 종목용) */
function makeItem(name, symbol, currency, series){
  const c=series.map(r=>r.c), n=c.length;
  const close=c[n-1], prev=c[n-2];
  const high52=Math.max(...c), low52=Math.min(...c);
  const ma200=c.slice(-Math.min(200,n)).reduce((a,b)=>a+b,0)/Math.min(200,n);
  const rsiArr=rsiSeries(c);
  // 볼린저(20,2)
  const w=c.slice(-20), mid=w.reduce((a,b)=>a+b,0)/w.length;
  const sd=Math.sqrt(w.reduce((a,b)=>a+(b-mid)**2,0)/w.length);
  const upper=mid+2*sd, lower=mid-2*sd;
  return {
    name, code:symbol, yahoo:symbol, currency,
    close, date:series[n-1].d, prevClose:prev,
    chgPct:+(((close-prev)/prev)*100).toFixed(2),
    week1:n>6? +(((close-c[n-6])/c[n-6])*100).toFixed(2):null,
    high52, low52,
    offHigh52:+(((high52-close)/high52)*100).toFixed(2),
    vsMa200:+((close/ma200-1)*100).toFixed(2),
    rsi14: rsiArr[n-1]!=null? +rsiArr[n-1].toFixed(1):null,
    bb20:{ mid:+mid.toFixed(4), upper:+upper.toFixed(4), lower:+lower.toFixed(4),
      pctB: upper===lower?null:+(((close-lower)/(upper-lower))*100).toFixed(1),
      bandWidth:+(((upper-lower)/mid)*100).toFixed(2) },
    series,
  };
}

function swings(s, look=3){
  const lo=[], hi=[], n=s.length;
  for(let i=look;i<n-look;i++){
    const win=s.slice(i-look,i+look+1);
    if(s[i].l<=Math.min(...win.map(x=>x.l))) lo.push({d:s[i].d, v:s[i].l});
    if(s[i].h>=Math.max(...win.map(x=>x.h))) hi.push({d:s[i].d, v:s[i].h});
  }
  return {lo,hi};
}

/* ---------- SVG 차트 ---------- */
function draw(it){
  const s = it.series;
  const n = s.length;
  const W = Math.min(n, Math.round(MONTHS*21.5));
  const win = s.slice(n-W);
  const closes = s.map(r=>r.c);
  const ma20=smaSeries(closes,20), ma60=smaSeries(closes,60), ma200=smaSeries(closes,200);
  const bb=bbSeries(closes);
  const rsi=rsiSeries(closes);
  const i0=n-W;

  const VW=960, PH=340, VH=60, RH=110, GAP=26, TOP=14, BOT=26, LPAD=64, RPAD=14;
  const H = TOP+PH+GAP+VH+GAP+RH+BOT;
  const plotW = VW-LPAD-RPAD;
  const sx = (k)=> LPAD + plotW*(k+0.5)/W;
  const cw = Math.max(1.6, Math.min(9, plotW/W*0.66));

  let lo=Infinity, hi=-Infinity;
  for(let i=i0;i<n;i++){ lo=Math.min(lo,s[i].l,bb.l[i]); hi=Math.max(hi,s[i].h,bb.u[i],ma200[i]); }
  const pad=(hi-lo)*0.05; lo-=pad; hi+=pad;
  const py=(v)=> TOP + PH*(1-(v-lo)/(hi-lo));

  const vmax=Math.max(...win.map(r=>r.v),1);
  const vy0=TOP+PH+GAP, vy=(v)=> vy0+VH*(1-v/vmax);
  const ry0=vy0+VH+GAP, ry=(v)=> ry0+RH*(1-v/100);

  const P=[];
  P.push(`<svg viewBox="0 0 ${VW} ${H}" role="img" aria-label="${it.name} 차트">`);

  // 가격 그리드 + 축 라벨
  for(let g=0;g<=4;g++){
    const v=lo+(hi-lo)*g/4, y=py(v);
    P.push(`<line x1="${LPAD}" y1="${y}" x2="${VW-RPAD}" y2="${y}" stroke="var(--grid)" stroke-width="1"/>`);
    P.push(`<text x="${LPAD-8}" y="${y+4}" font-size="11" fill="var(--ink-3)" text-anchor="end">${fmt(v)}</text>`);
  }
  // 볼린저 밴드
  let band='';
  for(let i=i0;i<n;i++) band+=`${sx(i-i0).toFixed(1)},${py(bb.u[i]).toFixed(1)} `;
  for(let i=n-1;i>=i0;i--) band+=`${sx(i-i0).toFixed(1)},${py(bb.l[i]).toFixed(1)} `;
  P.push(`<polygon points="${band}" fill="var(--bandfill)"/>`);
  const line=(arr, color, w=1.8, dash='')=>{
    let pts=''; for(let i=i0;i<n;i++) pts+=`${sx(i-i0).toFixed(1)},${py(arr[i]).toFixed(1)} `;
    P.push(`<polyline points="${pts}" fill="none" stroke="${color}" stroke-width="${w}" ${dash?`stroke-dasharray="${dash}"`:''} stroke-linejoin="round"/>`);
  };
  line(bb.u,'var(--down)',1,'2 3'); line(bb.l,'var(--down)',1,'2 3');
  line(ma20,'var(--ma20)'); line(ma60,'var(--ma60)'); line(ma200,'var(--ma200)',2);

  // 지지/저항
  const sw=swings(s.slice(-Math.max(W,120)));
  const c0=it.close;
  const sup=[...sw.lo].reverse().find(x=>x.v<=c0*1.01);
  const res=[...sw.hi].reverse().find(x=>x.v>=c0*1.03);
  if(sup && sup.v>lo){ const y=py(sup.v);
    P.push(`<line x1="${LPAD}" y1="${y}" x2="${VW-RPAD}" y2="${y}" stroke="var(--down)" stroke-width="1.3" stroke-dasharray="7 5"/>`);
    P.push(`<text x="${LPAD+4}" y="${y+15}" font-size="11.5" font-weight="700" fill="var(--down)">지지 후보 ${fmt(sup.v)} (${sup.d.slice(5).replace('-','/')})</text>`); }
  if(res && res.v<hi){ const y=py(res.v);
    P.push(`<line x1="${LPAD}" y1="${y}" x2="${VW-RPAD}" y2="${y}" stroke="var(--up)" stroke-width="1.3" stroke-dasharray="7 5"/>`);
    P.push(`<text x="${LPAD+4}" y="${y-6}" font-size="11.5" font-weight="700" fill="var(--up)">저항 후보 ${fmt(res.v)} (${res.d.slice(5).replace('-','/')})</text>`); }

  // 캔들
  for(let i=i0;i<n;i++){
    const r=s[i], x=sx(i-i0), up=r.c>=r.o, col=up?'var(--up)':'var(--down)';
    P.push(`<line x1="${x.toFixed(1)}" y1="${py(r.h).toFixed(1)}" x2="${x.toFixed(1)}" y2="${py(r.l).toFixed(1)}" stroke="${col}" stroke-width="1"/>`);
    const t=py(Math.max(r.o,r.c)), b=py(Math.min(r.o,r.c));
    P.push(`<rect x="${(x-cw/2).toFixed(1)}" y="${t.toFixed(1)}" width="${cw.toFixed(1)}" height="${Math.max(b-t,1.5).toFixed(1)}" fill="${col}"/>`);
  }
  // 범례
  P.push(`<text x="${LPAD}" y="${TOP-2}" font-size="11.5" fill="var(--ink-3)">캔들: <tspan fill="var(--up)" font-weight="700">양봉</tspan>·<tspan fill="var(--down)" font-weight="700">음봉</tspan>  <tspan fill="var(--ma20)" font-weight="700">— 20일선</tspan>  <tspan fill="var(--ma60)" font-weight="700">— 60일선</tspan>  <tspan fill="var(--ma200)" font-weight="700">— 200일선</tspan>  <tspan fill="var(--down)">┈ 볼린저밴드(20,2σ)</tspan></text>`);

  // 거래량
  for(let i=i0;i<n;i++){
    const r=s[i], x=sx(i-i0);
    const up = i>0 ? r.c>=s[i-1].c : r.c>=r.o;
    P.push(`<rect x="${(x-cw/2).toFixed(1)}" y="${vy(r.v).toFixed(1)}" width="${cw.toFixed(1)}" height="${(vy0+VH-vy(r.v)).toFixed(1)}" fill="${up?'var(--up)':'var(--down)'}" opacity="0.6"/>`);
  }
  P.push(`<text x="${LPAD-8}" y="${vy0+12}" font-size="11" fill="var(--ink-3)" text-anchor="end">거래량</text>`);

  // RSI
  P.push(`<rect x="${LPAD}" y="${ry(70)}" width="${plotW}" height="${ry(30)-ry(70)}" fill="var(--grid)" opacity="0.45"/>`);
  P.push(`<line x1="${LPAD}" y1="${ry(70)}" x2="${VW-RPAD}" y2="${ry(70)}" stroke="var(--up)" stroke-width="1" stroke-dasharray="5 4"/>`);
  P.push(`<line x1="${LPAD}" y1="${ry(30)}" x2="${VW-RPAD}" y2="${ry(30)}" stroke="var(--down)" stroke-width="1" stroke-dasharray="5 4"/>`);
  P.push(`<text x="${VW-RPAD+2}" y="${ry(70)+4}" font-size="10" fill="var(--up)">70</text>`);
  P.push(`<text x="${VW-RPAD+2}" y="${ry(30)+4}" font-size="10" fill="var(--down)">30</text>`);
  let rp='';
  for(let i=i0;i<n;i++) if(rsi[i]!=null) rp+=`${sx(i-i0).toFixed(1)},${ry(rsi[i]).toFixed(1)} `;
  P.push(`<polyline points="${rp}" fill="none" stroke="var(--rsi)" stroke-width="1.8" stroke-linejoin="round"/>`);
  const lastR=rsi[n-1];
  if(lastR!=null) P.push(`<text x="${VW-RPAD}" y="${ry(lastR)-8}" font-size="11.5" font-weight="700" fill="var(--rsi)" text-anchor="end">RSI ${lastR.toFixed(1)}</text>`);
  P.push(`<text x="${LPAD-8}" y="${ry0+12}" font-size="11" fill="var(--ink-3)" text-anchor="end">RSI(14)</text>`);

  // x축 (월)
  let seen=new Set();
  for(let i=i0;i<n;i++){
    const m=s[i].d.slice(2,7);
    if(!seen.has(m)){ seen.add(m);
      P.push(`<text x="${sx(i-i0).toFixed(1)}" y="${H-8}" font-size="11" fill="var(--ink-3)">${m.replace('-','.')}</text>`); }
  }
  P.push('</svg>');
  $('fig').innerHTML=P.join('')+'<div id="tip"></div>';
  hover(it, {W, i0, LPAD, plotW, VW, s});
  return {sup,res,rsi:lastR,ma20:ma20[n-1],ma60:ma60[n-1],ma200:ma200[n-1],
          ma20slope: ma20[n-1]-ma20[Math.max(0,n-6)], win};
}

/* ---------- 호버 툴팁 ---------- */
function hover(it, g){
  const svg=$('fig').querySelector('svg'), tip=$('tip');
  const move=(ev)=>{
    const r=svg.getBoundingClientRect();
    const x=(ev.clientX-r.left)*g.VW/r.width;
    let k=Math.round((x-g.LPAD)/g.plotW*g.W-0.5);
    if(k<0||k>=g.W){ tip.style.display='none'; return; }
    const d=g.s[g.i0+k];
    const prev=g.i0+k>0? g.s[g.i0+k-1].c : d.o;
    const chg=(d.c-prev)/prev*100;
    const dd=it.currency==='USD'?2:0;
    tip.innerHTML=`<b>${d.d}</b> <span class="${chg>=0?'pos':'neg'}">${chg>=0?'+':''}${chg.toFixed(1)}%</span><br>`+
      `종가 <b>${fmt(d.c,dd)}</b> · 시 ${fmt(d.o,dd)} 고 ${fmt(d.h,dd)} 저 ${fmt(d.l,dd)}<br>거래량 ${fmt(d.v)}`;
    tip.style.display='block';
    const fw=$('fig').clientWidth, tw=tip.offsetWidth;
    let left=(ev.clientX-r.left)+14;
    if(left+tw>fw-4) left=(ev.clientX-r.left)-tw-14;
    tip.style.left=Math.max(4,left)+'px';
    tip.style.top=Math.min(ev.clientY-r.top+12, $('fig').clientHeight-70)+'px';
  };
  svg.addEventListener('mousemove', move);
  svg.addEventListener('touchmove', (e)=>{ if(e.touches[0]) move(e.touches[0]); }, {passive:true});
  svg.addEventListener('mouseleave', ()=>{ tip.style.display='none'; });
}

/* ---------- 차트 따라 읽기 (시각 요소 해설) ---------- */
function chartReading(it, ctx){
  const s=it.series, n=s.length, c=it.close;
  const items=[];
  const li=(color, html)=>items.push(`<li><span class="chip" style="background:${color}"></span><span>${html}</span></li>`);

  // 1) 캔들 색 비율 (최근 10일)
  const last10=s.slice(-10);
  const upN=last10.filter(r=>r.c>=r.o).length;
  const candleMsg = upN>=7?`최근 10일 중 <b>빨간 양봉이 ${upN}개</b> — 요즘은 사는 힘이 우세한 흐름이에요.`
    : upN<=3?`최근 10일 중 <b>파란 음봉이 ${10-upN}개</b> — 요즘은 파는 힘이 우세한 흐름이에요.`
    : `최근 10일은 양봉 ${upN}개·음봉 ${10-upN}개 — 사고파는 힘이 팽팽해요.`;
  li('var(--up)', `<b>빨강·파랑 막대(캔들)</b> — 하루하루의 가격 기록. 빨강=오른 날, 파랑=내린 날. ${candleMsg}`);

  // 2) 이평선 위치
  const below=[ctx.ma20,ctx.ma60,ctx.ma200].filter(m=>c<m).length;
  const maMsg = below===3?`지금 캔들이 <b>세 선 모두 아래</b>에 있어요 — 단기·중기·장기 평균보다 싸게 거래되는 중이지만, 그만큼 추세가 아래를 향한다는 뜻이기도 해요.`
    : below===0?`지금 캔들이 <b>세 선 모두 위</b>에 있어요 — 추세가 위를 향하고 있다는 신호예요.`
    : `지금 캔들이 선들 사이에 끼어 있어요 — 추세가 어느 한쪽으로 정리되지 않은 상태예요.`;
  li('var(--ma20)', `<b>주황(20일)·초록(60일)·보라(200일) 곡선</b> — 각각 최근 1달·3달·1년의 평균 가격이에요. ${maMsg}`);

  // 3) 20일선 기울기
  const slopeMsg = ctx.ma20slope<0?`주황 20일선이 <b>아래로 기울어져</b> 있죠 — 최근 한 달의 흐름이 하락이라는 뜻이에요.`
    : `주황 20일선이 <b>위로 기울어져</b> 있죠 — 최근 한 달의 흐름이 상승이라는 뜻이에요.`;
  li('var(--ma20)', `<b>선의 기울기</b> — ${slopeMsg}`);

  // 4) 볼린저밴드
  if(it.bb20){
    const b=it.bb20;
    const bbPos = b.pctB<=15?'캔들이 띠의 <b>바닥 쪽</b>에 붙어 있어요 — 평소 움직임 범위에서 이례적으로 낮은 위치라는 뜻'
      : b.pctB>=85?'캔들이 띠의 <b>천장 쪽</b>에 붙어 있어요 — 평소 범위에서 이례적으로 높은 위치라는 뜻'
      : '캔들이 띠의 중간쯤에 있어요 — 평소 움직임 범위 안이라는 뜻';
    li('var(--down)', `<b>연한 파란 띠(볼린저밴드)</b> — 주가가 약 95% 확률로 머무는 "평소 범위". ${bbPos}이에요.`);
  }

  // 5) 지지/저항 점선
  if(ctx.sup && c<=ctx.sup.v*1.06)
    li('var(--down)', `<b>파란 가로 점선(지지 후보 ${fmt(ctx.sup.v)}원)</b> — 과거에 하락을 받아줬던 가격대인데, 지금 주가가 그 <b>바로 근처</b>예요. 여기서 버티느냐 뚫리느냐가 관전 포인트.`);
  else if(ctx.res && c>=ctx.res.v*0.94)
    li('var(--up)', `<b>빨간 가로 점선(저항 후보 ${fmt(ctx.res.v)}원)</b> — 과거에 상승이 막혔던 가격대인데, 지금 주가가 그 근처까지 올라와 있어요. 뚫으면 추세가 한 단계 개선돼요.`);
  else if(ctx.sup||ctx.res)
    li('var(--axis)', `<b>가로 점선들</b> — 과거에 여러 번 막히거나(빨강, 저항) 받쳐줬던(파랑, 지지) 가격대예요. 주가가 그 근처에 오면 공방이 벌어지기 쉬워요.`);

  // 6) 거래량
  const v5=s.slice(-5).reduce((a,r)=>a+r.v,0)/5;
  const v20=s.slice(-25,-5).reduce((a,r)=>a+r.v,0)/20;
  const vr=v20? v5/v20:1;
  const vMsg = vr>=1.5?`최근 막대들이 평소보다 <b>눈에 띄게 큽니다(${vr.toFixed(1)}배)</b> — 많은 사람이 참여한 움직임이라 방향의 신뢰도가 높아요.`
    : vr<=0.6?`최근 막대들이 평소보다 작아요(${vr.toFixed(1)}배) — 참여가 적은 움직임이라 힘이 약해요.`
    : `최근 막대 크기는 평소와 비슷해요 — 특별히 힘이 실리지도, 빠지지도 않은 상태.`;
  li('var(--ink-3)', `<b>가운데 막대들(거래량)</b> — 그날 얼마나 많이 거래됐는지. ${vMsg}`);

  // 7) RSI
  if(ctx.rsi!=null){
    const r=ctx.rsi;
    const rMsg = r<=30?`선이 <b>파란 점선(30) 아래</b>예요 — 단기간에 너무 많이 빠져 지친 "과매도" 상태.`
      : r<40?`선이 파란 점선(30) <b>근처</b>까지 내려와 있어요 — 약세지만 아직 과매도 기준(30)에는 닿지 않았어요.`
      : r>=70?`선이 <b>빨간 점선(70) 위</b>예요 — 단기간에 많이 올라 과열된 "과매수" 상태.`
      : r>60?`선이 빨간 점선(70) 근처로 올라와 있어요 — 상승 힘이 강한 상태.`
      : `선이 30~70 사이 중간권이에요 — 과열도 침체도 아닌 상태.`;
    li('var(--rsi)', `<b>맨 아래 초록 선(RSI)</b> — 최근 14일간 오른 힘과 내린 힘의 비율(0~100). ${rMsg}`);
  }
  $('readBody').innerHTML=items.join('');
  $('readCard').style.display='block';
}

/* ---------- 자동 진단 (서술형) ---------- */
function diagnose(it, ctx){
  const c=it.close, s=it.series, n=s.length, out=[];
  const dg=(t,body)=>out.push(`<div class="dg"><b class="t">${t}</b>${body}</div>`);
  const won=it.currency==='USD'?'달러':'원';
  const dd=it.currency==='USD'?2:0;
  const F=(v)=>fmt(v,dd);

  // 추세 분류
  let tw;
  if(c<ctx.ma20 && ctx.ma20<ctx.ma60 && ctx.ma60<ctx.ma200) tw='down';
  else if(c>ctx.ma20 && ctx.ma20>ctx.ma60 && ctx.ma60>ctx.ma200) tw='up';
  else tw = c>ctx.ma200?'mixed-up':'mixed-down';

  const r=it.rsi14 ?? ctx.rsi, bb=it.bb20;
  const nearLow = c<=it.low52*1.03, nearHigh = c>=it.high52*0.97;
  const oversold = (r!=null&&r<=32)&&(bb&&bb.pctB<=15);
  const overbought = (r!=null&&r>=68)&&(bb&&bb.pctB>=85);

  // ---- 결론 ----
  let concl;
  if(tw==='down') concl = nearLow? '뚜렷한 하락추세 속에서 52주 최저가 부근의 지지를 시험받는 중'
    : '뚜렷한 하락추세가 진행 중 — 추세 전환 신호를 확인하기 전까지는 보수적으로 볼 구간';
  else if(tw==='up') concl = overbought? '상승추세가 이어지고 있지만 단기 과열 신호가 겹친 구간'
    : nearHigh? '상승추세 속에서 52주 고점 부근을 시험하는 중':'상승추세가 유지되고 있는 구간';
  else if(tw==='mixed-up') concl='추세가 정리되지 않은 혼조 구간 — 다만 200일선 위는 지키고 있는 상태';
  else concl='추세가 정리되지 않은 혼조 구간 — 200일선 아래라 반등이 나와도 확인이 필요한 상태';
  $('verdict').innerHTML=`<b>결론부터:</b> ${it.name}은 지금 <b>"${concl}"</b>입니다.`;

  // ---- 추세와 이평선 (3장) ----
  let t1;
  if(tw==='down') t1=`현재가 ${F(c)}${won}은 20일선(${F(ctx.ma20)})·60일선(${F(ctx.ma60)})·200일선(${F(ctx.ma200)})보다 <b>전부 아래에 있는 완전 역배열</b>로, 교과서적인 하락추세예요. 200일선 대비 ${it.vsMa200}%.`;
  else if(tw==='up') t1=`현재가 ${F(c)}${won}은 20일선(${F(ctx.ma20)})·60일선(${F(ctx.ma60)})·200일선(${F(ctx.ma200)})보다 <b>전부 위에 있는 완전 정배열</b>로, 교과서적인 상승추세예요. 200일선 대비 +${it.vsMa200}%.`;
  else t1=`현재가 ${F(c)}${won}은 이평선들 사이에 끼어 있는 혼조 상태예요 (20일선 ${F(ctx.ma20)}, 60일선 ${F(ctx.ma60)}, 200일선 ${F(ctx.ma200)}, 200일선 대비 ${it.vsMa200>0?'+':''}${it.vsMa200}%).`;
  // 스윙 구조
  const sw=swings(s.slice(-160));
  const h3=sw.hi.slice(-3), l3=sw.lo.slice(-3);
  if(h3.length===3&&l3.length===3){
    const hDesc=h3.every((x,i)=>i===0||x.v<h3[i-1].v), lDesc=l3.every((x,i)=>i===0||x.v<l3[i-1].v);
    const hAsc=h3.every((x,i)=>i===0||x.v>h3[i-1].v), lAsc=l3.every((x,i)=>i===0||x.v>l3[i-1].v);
    const seq=(a)=>a.map(x=>F(x.v)).join(' → ');
    if(hDesc&&lDesc) t1+=` 최근 스윙 고점이 ${seq(h3)}으로, 저점도 ${seq(l3)}으로 <b>계단식으로 낮아지는 전형적 하락 구조</b>가 이어지고 있어요.`;
    else if(hAsc&&lAsc) t1+=` 최근 스윙 고점(${seq(h3)})과 저점(${seq(l3)})이 <b>같이 높아지는 건강한 상승 구조</b>예요.`;
  }
  dg('추세와 이평선 (가이드 3장)', t1);

  // ---- 지지·저항 (4장) + 최근 캔들 ----
  const last=s[n-1];
  const lowerT=Math.min(last.o,last.c)-last.l, upperT=last.h-Math.max(last.o,last.c);
  const rng=last.h-last.l||1;
  let t2='';
  if(ctx.sup){
    t2+=`핵심 가격대는 <b>${F(ctx.sup.v)}${won}</b>(${ctx.sup.d} 저점)이에요. `;
    if(lowerT>rng*0.3 && c<=ctx.sup.v*1.06)
      t2+=`마지막 거래일엔 장중 ${F(last.l)}까지 밀렸다가 ${F(last.c)}로 마감하며 <b>아래꼬리를 남겼는데</b>, 그 가격대에서 사려는 힘이 일부 받쳤다는 흔적이에요. 다만 종가가 지지선 턱걸이 수준이라 "지지 성공"이 아니라 <b>"지지 시험 중"</b>이 정확한 표현이에요. `;
    if(nearLow) t2+=`이 선이 무너지면 최근 1년 안에는 참고할 다음 지지선이 없습니다. `;
  } else t2+=`최근 1년 안에는 현재가 아래에 뚜렷한 지지 이력이 없어요 — 저점을 새로 만드는 중입니다. `;
  if(ctx.res) t2+=`${tw==='down'||tw==='mixed-down'?'반등하더라도 위로는':'위로는'} <b>${F(ctx.res.v)}${won}</b>(${ctx.res.d} 고점${Math.abs(ctx.res.v-ctx.ma20)/ctx.ma20<0.05?' + 20일선 부근':''})이 1차 저항이에요.`;
  if(upperT>rng*0.35) t2+=` 참고로 마지막 캔들엔 긴 위꼬리가 있어요 — 위에서 파는 힘이 아직 강하다는 흔적.`;
  dg('지지·저항 (가이드 4장)', t2);

  // ---- 거래량 (5장) ----
  const v20=s.slice(-21,-1).reduce((a,x)=>a+x.v,0)/20;
  const vr=v20? last.v/v20:1;
  let t3 = vr>=1.8?`마지막 거래일 ${fmt(last.v)}주로 20일 평균(${fmt(v20)}주)의 <b>${vr.toFixed(1)}배</b> — 많은 사람이 참여한 움직임이라 이 방향의 신뢰도가 높아요.`
    : vr<=0.6?`마지막 거래일 ${fmt(last.v)}주로 20일 평균의 ${vr.toFixed(1)}배 — 거래가 얇아 이 움직임에 큰 의미를 두긴 어려워요.`
    : `마지막 거래일 ${fmt(last.v)}주로 20일 평균(${fmt(v20)}주)과 비슷했어요. 투매성 폭증도, 대량 매수 유입도 아직 아니라는 뜻이에요.`;
  if(tw==='down') {
    const recentBull = s.slice(-3).some(x=>x.c>x.o && x.v>v20*1.5);
    t3 += recentBull? ` 다만 최근 3일 안에 <b>거래량 실린 양봉</b>이 나왔어요 — 바닥 다지기의 첫 신호일 수 있어 주목할 만해요.`
      : ` 바닥 확인에는 "지지선 근처에서 거래량 실린 양봉"이 필요한데, 아직 안 나왔습니다.`;
  }
  dg('거래량 (가이드 5장)', t3);

  // ---- RSI·볼린저밴드 (7·8장) ----
  let t4='';
  if(r!=null){
    t4 += r<=30?`RSI ${r}로 <b>과매도권</b>이에요 — 단기적으로 많이 지친 상태. `
      : r<40?`RSI ${r}로 약세권이지만 과매도(30 이하)까지는 안 갔어요. `
      : r>=70?`RSI ${r}로 <b>과매수권</b> — 단기 과열 상태예요. `
      : r>60?`RSI ${r}로 강세권이에요. `:`RSI ${r}로 중립권이에요. `;
  }
  if(bb){
    t4 += bb.pctB<=15?`볼린저밴드는 %B ${bb.pctB}로 <b>하단권</b>이고`
      : bb.pctB>=85?`볼린저밴드는 %B ${bb.pctB}로 <b>상단권</b>이고`
      : `볼린저밴드 내 위치는 %B ${bb.pctB}(0=하단, 100=상단)이고`;
    t4 += bb.bandWidth>=30?`, 밴드폭이 ${bb.bandWidth}%로 매우 넓어진 상태 — 변동성이 극도로 커진 국면이에요.`
      : bb.bandWidth<=12?`, 밴드폭이 ${bb.bandWidth}%로 수축(스퀴즈)돼 있어요 — 조만간 큰 움직임이 나올 수 있는 상태.`
      : ` 밴드폭은 ${bb.bandWidth}%예요.`;
    if(tw==='down'&&bb.pctB<=20&&bb.bandWidth>=30)
      t4+=` 이럴 때는 가이드에서 경고한 <b>"하단을 타고 계속 내려가는 밴드 워킹"</b> 위험도 함께 봐야 해요 — 하단 터치가 자동으로 반등을 뜻하진 않습니다.`;
  }
  if(t4) dg('RSI·볼린저밴드 (가이드 7·8장)', t4);

  // ---- 차트 밖 맥락 (6장) ----
  if(it.offHigh52>=30)
    dg('차트 밖 맥락 (가이드 6장)', `고점 대비 -${it.offHigh52}%로 낙폭이 크지만, "많이 빠졌으니 싸다"는 함정일 수 있어요. 이만큼 빠진 데는 대개 이유(실적·수주·업황 뉴스)가 있으니 <b>왜 빠졌는지</b>를 꼭 함께 확인하세요. 뉴스 맥락까지 엮은 깊은 해석은 Claude에게 "${it.name} 차트 봐줘"라고 물어보면 받을 수 있어요.`);

  // ---- 관찰 포인트 ----
  let pts=[];
  if(tw==='down'||tw==='mixed-down'){
    if(ctx.sup) pts.push(`<b>${F(ctx.sup.v)}${won} 지지</b>가 지켜지는지, 특히 그 근처에서 거래량 실린 양봉이 나오는지`);
    else pts.push(`저점 갱신이 멈추고 바닥을 다지는 흔적(긴 아래꼬리 + 거래량)이 나오는지`);
    if(r!=null&&r>30&&r<45) pts.push(`RSI(현재 ${r})가 30 아래로 들어가는지 — 들어가면 단기 과매도 신호 겹침`);
    else if(oversold) pts.push(`RSI·볼린저가 이미 과매도 신호 — 낙폭과대 반등 가능성은 있지만 거래량 확인 후 판단`);
    if(ctx.res) pts.push(`반등해도 <b>${F(ctx.res.v)}${won} 저항</b>을 돌파하기 전까지는 하락추세 지속으로 보는 게 안전`);
  } else if(tw==='up'){
    pts.push(`<b>20일선(${F(ctx.ma20)})</b> 위에서 흐름이 유지되는지 — 유지되는 한 추세 존중`);
    if(overbought) pts.push(`RSI·볼린저 모두 과열 신호 — 신규 진입은 눌림(20일선 부근)을 기다리는 게 유리`);
    else if(ctx.res) pts.push(`${F(ctx.res.v)}${won} 저항 돌파 여부 — 거래량과 함께 뚫으면 추세 연장 신호`);
    pts.push(`거래량 없이 오르는 날이 늘어나면 힘이 빠지는 신호로 참고`);
  } else {
    pts.push(`<b>200일선(${F(ctx.ma200)})</b> ${tw==='mixed-up'?'위를 지키는지 — 지키면 조정, 깨지면 추세 훼손':'회복 여부 — 회복 전까진 보수적으로'}`);
    if(ctx.sup) pts.push(`${F(ctx.sup.v)}${won} 지지 유지 여부`);
    if(ctx.res) pts.push(`${F(ctx.res.v)}${won} 저항 돌파 여부`);
  }
  const circ=['①','②','③','④'];
  dg('관찰 포인트', pts.map((p,i)=>`${circ[i]} ${p}`).join(' &nbsp; '));

  $('diagBody').innerHTML=out.join('');
}

/* ---------- 상단 스탯 ---------- */
function stats(it){
  const chg=it.chgPct, cls=chg>=0?'pos':'neg';
  const cur=it.currency==='USD'?'$':'원';
  $('stats').innerHTML = `
    <div class="stat"><div class="k">종가 (${it.date})</div><div class="v">${fmt(it.close, it.currency==='USD'?2:0)}<small> ${cur}</small></div></div>
    <div class="stat"><div class="k">전일 대비</div><div class="v ${cls}">${chg>=0?'+':''}${chg}%</div></div>
    <div class="stat"><div class="k">1주일</div><div class="v ${it.week1>=0?'pos':'neg'}">${it.week1>=0?'+':''}${it.week1??'–'}%</div></div>
    <div class="stat"><div class="k">52주 고점 대비</div><div class="v">-${it.offHigh52}%</div></div>
    <div class="stat"><div class="k">RSI(14)</div><div class="v">${it.rsi14??'–'}</div></div>
    <div class="stat"><div class="k">볼린저 %B</div><div class="v">${it.bb20?it.bb20.pctB:'–'}</div></div>`;
}

function render(){
  if(!CUR) return;
  stats(CUR);
  const ctx=draw(CUR);
  chartReading(CUR, ctx);
  $('diag').style.display='block';
  diagnose(CUR, ctx);
}

async function init(){
  try{
    const res=await fetch('data/portfolio.json',{cache:'no-store'});
    DATA=await res.json();
  }catch(e){
    $('asof').textContent='데이터를 불러오지 못했어요. 잠시 후 새로고침 해주세요.';
    return;
  }
  const items=DATA.items.filter(x=>x.series&&x.series.length>40);
  $('asof').textContent=`${DATA.asOf} 종가 기준 · 아무 종목이나 검색해서 진단해보세요`;
  document.querySelectorAll('#rangeSeg button').forEach(b=>{
    b.onclick=()=>{ document.querySelectorAll('#rangeSeg button').forEach(x=>x.classList.remove('on'));
      b.classList.add('on'); MONTHS=+b.dataset.m; render(); };
  });
  initSearch();
  /* 첫 화면 예시: 대표 지수 ETF */
  CUR=items.find(x=>x.name==='KODEX 200')||items[0]; render();
}

/* ---------- 종목 검색 (모든 종목) ---------- */
function initSearch(){
  const q=$('q'), box=$('sres');
  let timer=null;
  const hide=()=>{ box.style.display='none'; };
  q.addEventListener('input', ()=>{
    clearTimeout(timer);
    const term=q.value.trim();
    if(term.length<2){ hide(); return; }
    timer=setTimeout(async ()=>{
      box.innerHTML='<div class="empty">검색 중…</div>'; box.style.display='block';
      try{
        const r=await fetch(`/api/search?q=${encodeURIComponent(term)}`);
        const j=await r.json();
        if(!j.results||!j.results.length){ box.innerHTML='<div class="empty">검색 결과가 없어요. 정확한 종목명이나 티커로 시도해보세요.</div>'; return; }
        box.innerHTML=j.results.map(x=>
          `<button data-s="${x.symbol}" data-n="${x.name.replace(/"/g,'&quot;')}">${x.name} <span class="meta">${x.symbol} · ${x.exch}</span></button>`).join('');
        box.querySelectorAll('button').forEach(b=>{
          b.onclick=()=>{ hide(); q.value=b.dataset.n; loadSymbol(b.dataset.s, b.dataset.n); };
        });
      }catch(e){ box.innerHTML='<div class="empty">검색 서버가 잠시 응답하지 않아요 — 다시 시도해주세요.</div>'; }
    }, 350);
  });
  document.addEventListener('click', (e)=>{ if(!e.target.closest('.searchbox')) hide(); });
}

async function loadSymbol(symbol, name){
  $('fig').innerHTML='<div class="loading">'+name+' 시세 불러오는 중…</div>';
  try{
    const r=await fetch(`/api/chart?symbol=${encodeURIComponent(symbol)}`);
    const j=await r.json();
    if(j.error) throw new Error(j.error);
    CUR=makeItem(name||j.name, j.symbol, j.currency, j.series);
    render();
  }catch(e){
    $('fig').innerHTML=`<div class="loading">시세를 불러오지 못했어요 (${e.message}). 잠시 후 다시 시도해주세요.</div>`;
  }
}
init();
</script>

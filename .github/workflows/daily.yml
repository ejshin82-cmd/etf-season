name: 매일 시장 데이터 수집

on:
  schedule:
    # UTC 기준 21:30 = 한국시간 익일 06:30 (미국 장 마감 후)
    - cron: "30 21 * * 1-5"
    - cron: "0 9 * * 1-5"     # 한국시간 당일 18:00 — 한국 마감 후  ← 추가
  workflow_dispatch:        # 저장소 Actions 탭에서 수동 실행도 가능
  push:
    paths:
      - "data/tickers.json" # 수집 목록이 바뀌면 즉시 재수집

permissions:
  contents: write

concurrency:
  group: fetch-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: 데이터 수집
        run: node scripts/fetch-data.mjs

      - name: 변경분 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market.json data/portfolio.json
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "데이터 갱신 $(date -u '+%Y-%m-%d')"
            git push
          fi
